<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Foto – CSS Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="galeri-header">
    <h1>Galeri Foto</h1>
    <p>koleksi foto menggunakan CSS Grid Layout</p>
  </header>

  <main class="galeri-grid">

    <figure class="item item--featured">
      <img src="https://tse4.mm.bing.net/th/id/OIP.-KAj7Rkr9UZTVhzJWgC3ewHaJg?rs=1&pid=ImgDetMain&o=7&rm=3" alt="messi" />
      <figcaption>messi</figcaption>
    </figure>

    <figure class="item">
      <img src="https://www.meme-arsenal.com/memes/fc60bf220ae314e9ae6ddc68707eddd1.jpg" alt="ronaldo" />
      <figcaption>Ronaldo</figcaption>
    </figure>

    <figure class="item">
      <img src="https://cdn.idntimes.com/content-images/community/2024/05/img-20240517-052734-3ed01fa4a5675b623c5104fbf46bdd52.jpg" alt="antony" />
      <figcaption>Antony</figcaption>
    </figure>

    <figure class="item item--wide">
      <img src="https://i.pinimg.com/originals/fe/0f/26/fe0f260522b4c72d7a50acfdffe756d3.jpg" alt="neymar" />
      <figcaption>neymar</figcaption>
    </figure>

    <figure class="item">
      <img src="https://th.bing.com/th/id/R.789d2e81c7642b23c6a0b630c42cabad?rik=pCVkKIfkA4kS4g&riu=http%3a%2f%2fwahup.com%2fcdn%2fshop%2farticles%2fimages_61a4c0c9-1697-4bb7-bc85-192beb10a52d.jpg%3fv%3d1748014061&ehk=IOPMYqG%2fo0So3HVjbW0YL6XAZvy5%2bO4rkl4%2bTp6hY%2fY%3d&risl=&pid=ImgRaw&r=0" alt="onana" />
      <figcaption>onana</figcaption>
    </figure>

    <figure class="item">
      <img src="https://picsum.photos/seed/sungai1/400/300" alt="Sungai Tenang" />
      <figcaption>Sungai Tenang</figcaption>
    </figure>

    <figure class="item item--tall">
      <img src="https://picsum.photos/seed/pohon1/400/600" alt="Pohon Tinggi" />
      <figcaption>Pohon Tinggi</figcaption>
    </figure>

    <figure class="item">
      <img src="https://picsum.photos/seed/danau1/400/300" alt="Danau Biru" />
      <figcaption>Danau Biru</figcaption>
    </figure>

    <figure class="item">
      <img src="https://picsum.photos/seed/sawah1/400/300" alt="Sawah Hijau" />
      <figcaption>Sawah Hijau</figcaption>
    </figure>

  </main>

</body>
</html>
